# <!-- Powered by BMAD™ Core -->
template:
  id: qa-gate-template-v1
  name: Quality Gate Decision
  version: 1.0
  output:
    format: yaml
    filename: qa.qaLocation/gates/{{epic_num}}.{{story_num}}-{{story_slug}}.yml
    title: "Quality Gate: {{epic_num}}.{{story_num}}"

# Required fields (keep these first)
schema: 1
story: "screener.2.4"
story_title: "本地快速測試模式"
gate: "CONCERNS" # PASS|CONCERNS|FAIL|WAIVED
status_reason: "Testing is pending due to existing test suite issues."
reviewer: "Quinn (Test Architect)"
updated: "2025-09-12T10:00:00Z"

# Always present but only active when WAIVED
waiver: { active: false }

# Issues (if any) - Use fixed severity: low | medium | high
top_issues:
  - id: "TEST-001"
    severity: medium
    finding: "Unit tests for this story are pending due to existing test suite issues (tests/test_main.py are failing/hanging)."
    suggested_action: "Fix failing/hanging tests in tests/test_main.py and implement specific unit tests for Story 2.4."

# Risk summary (from risk-profile task if run)
risk_summary:
  totals: { critical: 0, high: 0, medium: 1, low: 0 }
  recommendations:
    must_fix:
      - action: "Fix failing/hanging tests in tests/test_main.py"
        refs: ["tests/test_main.py"]
    monitor: []

# Examples section using block scalars for clarity
examples:
  with_issues: |
    top_issues:
      - id: "SEC-001"
        severity: high  # ONLY: low|medium|high
        finding: "No rate limiting on login endpoint"
        suggested_action: "Add rate limiting middleware before production"
      - id: "TEST-001"  
        severity: medium
        finding: "Missing integration tests for auth flow"
        suggested_action: "Add test coverage for critical paths"

  when_waived: |
    waiver:
      active: true
      reason: "Accepted for MVP release - will address in next sprint"
      approved_by: "Product Owner"

# ============ Optional Extended Fields ============ 
# Uncomment and use if your team wants more detail

optional_fields_examples:
  quality_and_expiry: |
    quality_score: 90
    expires: "2025-09-26T10:00:00Z"

  evidence: |
    evidence:
      tests_reviewed: 0
      risks_identified: 1
      trace:
        ac_covered: []
        ac_gaps: [1, 2, 3, 4, 5]

  nfr_validation: |
    nfr_validation:
      security: { status: PASS, notes: "" }
      performance: { status: PASS, notes: "" }
      reliability: { status: CONCERNS, notes: "Test reliability is an issue due to failing/hanging tests." }
      maintainability: { status: PASS, notes: "" }

  history: |
    history:  # Append-only audit trail
      - at: "2025-09-12T10:00:00Z"
        gate: CONCERNS
        note: "Initial review - tests pending."

  recommendations: |
    recommendations:
      immediate:  # Must fix before production
        - action: "Fix failing/hanging tests in tests/test_main.py"
          refs: ["tests/test_main.py"]
      future:  # Can be addressed later
        - action: "Implement specific unit tests for Story 2.4 (Task 4.1 and 4.2)"
          refs: ["docs/stories/story-2.4-local-test-mode.md"]
